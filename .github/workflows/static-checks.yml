name: Verificación estática

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar rutas y sintaxis JavaScript
        run: python3 scripts/check_project.py
      - name: Validar archivos e índices MITRE v20
        run: python3 scripts/validate_mitre_v20.py
